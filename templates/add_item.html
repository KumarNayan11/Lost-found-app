{% extends "base.html" %}

{% block content %}
<div class="form-page">
    <div class="form-container">
        <h1 class="form-title">📝 Report Lost Item</h1>
        <p class="form-subtitle">Fill in the details below to report your lost item</p>

        <form method="post" class="item-form">
            <div class="form-group">
                <label for="name">Item Name *</label>
                <input type="text" name="name" id="name" placeholder="e.g., Blue Water Bottle" required
                    class="form-input">
            </div>

            <div class="form-group">
                <label for="description">Description *</label>
                <textarea name="description" id="description" rows="4" placeholder="Describe your item in detail..."
                    required class="form-input"></textarea>
            </div>

            <div class="form-group">
                <label for="contact">Contact Information *</label>
                <input type="text" name="contact" id="contact" placeholder="Your email or phone number" required
                    class="form-input">
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary btn-large">Submit Report</button>
                <a href="{{ url_for('user_dashboard') }}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
